[package]
name = "matrix-tui"
version = "0.0.0"
authors = ["Xithrius <xithrius@gmail.com>"]
edition = "2024"
rust-version = "1.93.0"
description = "Matrix in the terminal."
repository = "https://github.com/Xithrius/matrix-tui"
license = "GPL-3.0"
keywords = ["tui", "matrix"]
categories = ["command-line-utilities"]

[dependencies]
tui = { package = "ratatui", version = "0.30.0", default-features = false, features = [
    "crossterm",
    "serde",
] }
matrix-sdk = { version = "0.16.1", features = ["sso-login"] }
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.6.1", features = ["derive", "cargo"] }
rustyline = "15.0.0"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"
config = { version = "0.15.23", default-features = false, features = ["toml"] }
directories = "5.0.1"
toml = "0.9.12"
url = "2.5.8"
futures-util = "0.3.32"
rand = "0.8.5"
chrono = "0.4.44"

[profile.dev]
lto = "off"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
